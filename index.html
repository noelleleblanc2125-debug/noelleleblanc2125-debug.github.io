<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Screenshot Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body {
    background: #1B2420;
    color: #F4EFE4;
    font-family: 'Lora', serif;
    margin: 0;
    padding: 40px 20px;
  }
  h1 {
    text-align: center;
    font-weight: 600;
    font-size: 2rem;
    margin-bottom: 50px;
  }
  .entry {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 30px;
    max-width: 800px;
    margin: 0 auto 70px auto;
  }
  .entry img {
    max-width: 100%;
    width: 420px;
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .sticky-note {
    background: #F6C64C;
    color: #2F3B36;
    font-family: 'Caveat', cursive;
    font-size: 1.4rem;
    line-height: 1.3;
    padding: 20px;
    width: 220px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transform: rotate(-3deg);
  }
</style>
</head>
<body>

<h1>My Screenshot Journal</h1>

<!-- ===== COPY FROM HERE FOR EACH NEW WEEKLY ENTRY ===== -->
<div class="entry">
  <img src="screenshot1.jpeg" alt="Screenshot 1">
  <div class="sticky-note">
    This screenshot speaks to an outcome that could happen when a traditional milestone that says we have reached adulthood falls through.
  </div>
</div>
<!-- ===== COPY TO HERE ===== -->

</body>
</html>
